# HTTPS termination example. Substitute runtime values on the proxy host.
server {
    listen 443 ssl;
    server_name plex-admin.example.com;
    ssl_certificate /etc/nginx/certs/YOUR_CERTIFICATE.pem;
    ssl_certificate_key /etc/nginx/certs/YOUR_PRIVATE_KEY.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_cache off;
    }
}
